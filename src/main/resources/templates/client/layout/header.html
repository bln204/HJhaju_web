<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Trang chủ</title>
</head>
<body>
<div th:fragment="header">
    <div class="navbar">
        <div class="navbar-container">
            <!-- Logo -->
            <a class="logo" href="/">
                <img th:src="@{/image/logo.png}" alt="Logo">
            </a>

            <!-- Menu -->
            <div class="menu">
                <a href="/">Trang Chủ</a>


                <div class="dropdown">
                    <button class="dropdown-btn">Thể Loại</button>
                    <div class="dropdown-content">
                        <div class="columns">
                            <div th:each="category : ${categories}">
                                <a th:href="@{/the-loai/{slug}(slug=${category.slug})}"
                                   th:text="${category.name}"></a>
                            </div>
                        </div>
                    </div>
                </div>


                <a href="#">Liên Hệ</a>
            </div>

            <!-- Search + Login -->
            <div style="display: flex; align-items: center;">
                <form th:action="@{/home/search}" method="get" class="search-container">
                    <input type="text" id="searchBox" name="keyword" th:value="${keyword}" placeholder="Tìm kiếm truyện..."
                           autocomplete="off">
                    <button type="submit" class="search-btn">Tìm</button>
                    <ul id="suggestions"
                        style="border:1px solid #ccc; max-width:250px; position:absolute; background:white; list-style:none; padding:5px; margin:0;">
                    </ul>
                </form>
                <div class="user-container">
                    <th:block th:if="${#authentication.getPrincipal() != null and #authentication.getPrincipal() != 'anonymousUser'}">
                        <span class="user-name" th:text="${#authentication.getPrincipal().fullName ?: 'Người dùng'}"></span>
                        <div class="dropdown-username">
                            <a th:href="@{/profile/edit}">Đổi tên hiển thị</a>
                            <a th:href="@{/profile/change-password}">Đổi mật khẩu</a>
                            <form th:action="@{/logout}" method="post">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" th:if="${_csrf != null}"/>
                                <button type="submit">Đăng xuất</button>
                            </form>
                        </div>
                    </th:block>
                    <th:block th:unless="${#authentication.getPrincipal() != null and #authentication.getPrincipal() != 'anonymousUser'}">
                        <a th:href="@{/login}">Đăng nhập</a>
                    </th:block>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
