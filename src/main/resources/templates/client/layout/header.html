<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Trang chủ</title>

    <style>
        .autocomplete-dropdown {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: rgba(20, 20, 20, 0.98);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 15px;
            margin-top: 8px;
            max-height: 400px;
            overflow-y: auto;
            z-index: 1000;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            opacity: 0;
            visibility: hidden;
            transform: translateY(-10px);
            transition: all 0.3s ease;
        }

        .autocomplete-dropdown.active {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }

        .autocomplete-dropdown::-webkit-scrollbar {
            width: 6px;
        }

        .autocomplete-dropdown::-webkit-scrollbar-track {
            background: rgba(255,255,255,0.1);
            border-radius: 3px;
        }

        .autocomplete-dropdown::-webkit-scrollbar-thumb {
            background: #ff6b6b;
            border-radius: 3px;
        }

        .autocomplete-header {
            padding: 15px 20px 10px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            color: rgba(255,255,255,0.7);
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .autocomplete-item {
            display: flex;
            align-items: center;
            padding: 12px 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .autocomplete-item:hover {
            background: rgba(255,255,255,0.08);
            transform: translateX(5px);
        }

        .autocomplete-item:last-child {
            border-bottom: none;
        }

        .manga-thumbnail {
            width: 45px;
            height: 60px;
            background: #333;
            border-radius: 6px;
            margin-right: 15px;
            overflow: hidden;
            flex-shrink: 0;
        }

        .manga-thumbnail img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .manga-info {
            flex: 1;
        }

        .manga-title {
            color: white;
            font-weight: 500;
            font-size: 14px;
            margin-bottom: 4px;
            line-height: 1.3;
        }

        .manga-meta {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }



        .manga-genre {
            color: rgba(255,255,255,0.5);
            font-size: 11px;
        }



        .no-results {
            padding: 30px 20px;
            text-align: center;
            color: rgba(255,255,255,0.5);
        }

        .no-results-icon {
            font-size: 48px;
            margin-bottom: 10px;
            opacity: 0.3;
        }

        .loading {
            padding: 20px;
            text-align: center;
            color: rgba(255,255,255,0.7);
        }

        .loading-spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: #ff6b6b;
            animation: spin 1s ease-in-out infinite;
            margin-right: 10px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .login-btn {
            background: transparent;
            color: white;
            border: 2px solid #ff6b6b;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-left: 10px;
        }

        .login-btn:hover {
            background: #ff6b6b;
            color: white;
        }



        /* Responsive */
        @media (max-width: 768px) {


            .autocomplete-item {
                padding: 10px 15px;
            }

            .manga-thumbnail {
                width: 40px;
                height: 50px;
                margin-right: 12px;
            }
        }
    </style>
</head>
<body>
<div th:fragment="header" class="header">
    <div class="navbar">
        <div class="navbar-container">
            <!-- Logo -->
            <a class="logo" href="/">
                <img th:src="@{/image/logo.png}" alt="Logo">
            </a>

            <!-- Menu -->
            <div class="menu">
                <a href="/">Trang Chủ</a>


                <div class="dropdown">
                    <button class="dropdown-btn">Thể Loại</button>
                    <div class="dropdown-content">
                        <div class="columns">
                            <div th:each="category : ${categories}">
                                <a th:href="@{/the-loai/{slug}(slug=${category.slug})}"
                                   th:text="${category.name}"></a>
                            </div>
                        </div>
                    </div>
                </div>


                <a href="#">Liên Hệ</a>
            </div>

            <!-- Search + Login -->
            <div style="display: flex; align-items: center;">
                <div class="search-container">
                    <input type="text" id="searchInput" name="keyword" placeholder="Tìm kiếm truyện..." autocomplete="off">
                    <button type="submit" class="search-btn" onclick="performSearch()">Tìm</button>
                    <div class="autocomplete-dropdown" id="autocompleteDropdown">
                        <div class="autocomplete-header" id="autocompleteHeader">
                        </div>
                        <div id="autocompleteResults">
                            <!-- Results will be populated here -->
                        </div>
                    </div>
                </div>

                <button class="login-btn">Đăng Nhập</button>
            </div>
        </div>
    </div>
</div>


<script>
    const searchInput = document.getElementById('searchInput');
    const autocompleteDropdown = document.getElementById('autocompleteDropdown');
    const autocompleteResults = document.getElementById('autocompleteResults');
    const autocompleteHeader = document.getElementById('autocompleteHeader');

    let searchTimeout;

    // Event listeners
    searchInput.addEventListener('input', handleSearch);
    searchInput.addEventListener('focus', handleFocus);
    searchInput.addEventListener('blur', handleBlur);

    // Handle search input
    function handleSearch(e) {
        const query = e.target.value.trim();

        clearTimeout(searchTimeout);

        if (query.length === 0) {
            hideDropdown();
            return;
        }

        showLoading();

        searchTimeout = setTimeout(() => {
            searchMangas(query);
        }, 300);
    }

    // Handle focus
    function handleFocus() {
        const query = searchInput.value.trim();
        if (query.length > 0) {
            searchMangas(query);
        }
    }

    // Handle blur
    function handleBlur() {
        setTimeout(() => {
            hideDropdown();
        }, 200);
    }

    // Search function (API call to backend)
    function searchMangas(query) {
        fetch(`/api/search/suggestions?query=${encodeURIComponent(query)}&limit=8`)
            .then(response => response.json())
            .then(results => displayResults(results, query))
            .catch(error => {
                console.error("Search error:", error);
                showNoResults(query);
            });
    }

    // Display search results
    function displayResults(results, query) {
        if (results.length === 0) {
            showNoResults(query);
            return;
        }

        autocompleteHeader.textContent = `Tìm thấy ${results.length} kết quả cho "${query}"`;

        const html = results.map(comic => `
        <div class="autocomplete-item" onclick="selectManga('${comic.slug}', '${comic.name}')">
            <div class="manga-thumbnail">
                <img src="${comic.thumbImage}" alt="${comic.name}" onerror="this.style.display='none'">
            </div>
            <div class="manga-info">
                <div class="manga-title">${highlightText(comic.name, query)}</div>
                <div class="manga-meta">
                    <div class="manga-genre">${comic.category}</div>
                </div>
            </div>
        </div>
    `).join('');

        autocompleteResults.innerHTML = html;
        showDropdown();
    }

    // Show loading state
    function showLoading() {
        autocompleteHeader.textContent = 'Đang tìm kiếm...';
        autocompleteResults.innerHTML = `
        <div class="loading">
            <div class="loading-spinner"></div>
            Đang tải kết quả...
        </div>
    `;
        showDropdown();
    }

    // Show no results
    function showNoResults(query) {
        autocompleteHeader.textContent = `Không tìm thấy kết quả cho "${query}"`;
        autocompleteResults.innerHTML = `
        <div class="no-results">
            <div class="no-results-icon">😞</div>
            <div>Không tìm thấy truyện nào phù hợp</div>
            <div style="margin-top: 5px; font-size: 11px; color: rgba(255,255,255,0.4);">
                Thử tìm kiếm với từ khóa khác
            </div>
        </div>
    `;
        showDropdown();
    }

    // Highlight matching text
    function highlightText(text, query) {
        const regex = new RegExp(`(${escapeRegExp(query)})`, 'gi');
        return text.replace(regex, '<span style="background: rgba(255,107,107,0.3); color: #ff6b6b; font-weight: bold;">$1</span>');
    }

    function escapeRegExp(string) {
        return string.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    }

    // Show / Hide dropdown
    function showDropdown() {
        autocompleteDropdown.classList.add('active');
    }
    function hideDropdown() {
        autocompleteDropdown.classList.remove('active');
    }

    // Select manga
    function selectManga(slug, name) {
        searchInput.value = name;
        hideDropdown();
        window.location.href = `/${slug}`;
    }

    // Perform search manually (search button)
    function performSearch() {
        const query = searchInput.value.trim();
        if (query) {
            window.location.href = `/search?keyword=${encodeURIComponent(query)}`;
        }
    }

    // Close dropdown when clicking outside
    document.addEventListener('click', function(e) {
        if (!e.target.closest('.search-container')) {
            hideDropdown();
        }
    });

    // Keyboard navigation
    let currentSelection = -1;
    searchInput.addEventListener('keydown', function(e) {
        const items = document.querySelectorAll('.autocomplete-item');

        switch(e.key) {
            case 'ArrowDown':
                e.preventDefault();
                currentSelection = Math.min(currentSelection + 1, items.length - 1);
                updateSelection(items);
                break;

            case 'ArrowUp':
                e.preventDefault();
                currentSelection = Math.max(currentSelection - 1, -1);
                updateSelection(items);
                break;

            case 'Enter':
                e.preventDefault();
                if (currentSelection >= 0 && items[currentSelection]) {
                    items[currentSelection].click();
                } else {
                    performSearch();
                }
                break;

            case 'Escape':
                hideDropdown();
                searchInput.blur();
                break;
        }
    });

    function updateSelection(items) {
        items.forEach((item, index) => {
            if (index === currentSelection) {
                item.style.background = 'rgba(255,107,107,0.2)';
            } else {
                item.style.background = '';
            }
        });
    }


</script>


</body>
</html>
