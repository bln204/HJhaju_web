<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <meta name="description" content="Xác thực OTP" />
    <meta name="author" content="" />
    <title>Xác thực OTP</title>
    <script src="https://use.fontawesome.com/releases/v6.3.0/js/all.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" th:href="@{/css/forgot-password.css}">
</head>
<body>
<div id="otpAuthLayout" class="auth-container">
    <div class="card shadow-lg border-0 rounded-lg">
        <div class="card-header">
            <h3 class="text-center font-weight-light my-4">Xác thực OTP</h3>
        </div>
        <div class="card-body">
            <!-- Thông báo thành công hoặc lỗi -->
            <div th:if="${message}" class="alert alert-success" th:text="${message}"></div>
            <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
            <form th:action="@{/verify-otp}" method="post" class="otp-form">
                <input type="hidden" name="email" th:value="${email}">
                <div class="form-floating mb-3">
                    <label for="otpInput">Mã OTP</label>
                    <input class="form-control" name="otp" id="otpInput" type="text" placeholder="OTP" required />
                </div>
                <div class="form-floating mb-3">
                    <label for="newPasswordInput">Mật khẩu mới</label>
                    <input class="form-control" name="newPassword" id="newPasswordInput" type="password" placeholder="Mật khẩu mới" required />
                </div>
                <div class="form-floating mb-3">
                    <label for="confirmPasswordInput">Xác nhận mật khẩu</label>
                    <input class="form-control" name="confirmPassword" id="confirmPasswordInput" type="password" placeholder="Xác nhận mật khẩu" required />
                </div>
                <div class="d-flex align-items-center justify-content-between mt-4 mb-0">
                    <button class="btn btn-primary" type="submit">Xác thực và đặt lại</button>
                    <a class="small text-muted" th:href="@{/login}">Quay lại đăng nhập</a>
                </div>
            </form>
<!--            <form th:action="@{/resend-otp}" method="post" class="mt-3">-->
<!--                <input type="hidden" name="email" th:value="${email}">-->
<!--                <button type="submit" class="btn btn-link">Gửi lại OTP</button>-->
<!--            </form>-->
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
<script th:src="@{/js/script.js}"></script>
</body>
</html>
