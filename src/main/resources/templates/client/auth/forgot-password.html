<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
  <meta name="description" content="Quên mật khẩu" />
  <meta name="author" content="" />
  <title>Quên mật khẩu</title>
  <script src="https://use.fontawesome.com/releases/v6.3.0/js/all.js" crossorigin="anonymous"></script>
  <link rel="stylesheet" th:href="@{/css/forgot-password.css}">
</head>
<body>
<div id="forgotAuthLayout" class="auth-container">
  <div class="card shadow-lg border-0 rounded-lg">
    <div class="card-header">
      <h3 class="text-center font-weight-light my-4">Quên mật khẩu</h3>
    </div>
    <div class="card-body">
      <!-- Thông báo thành công hoặc lỗi -->
      <div th:if="${message}" class="alert alert-success" th:text="${message}"></div>
      <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
      <form th:action="@{/forgot-password}" method="post" class="forgot-form">
        <div class="form-floating mb-3">
          <label for="forgotEmail">Địa chỉ email</label>
          <input class="form-control" name="email" id="forgotEmail" type="email" placeholder="name@example.com" required />
        </div>
        <div class="d-flex align-items-center justify-content-between mt-4 mb-0">
          <button class="btn btn-primary" type="submit">Gửi OTP</button>
          <a class="small text-muted" th:href="@{/login}">Quay lại đăng nhập</a>
        </div>
      </form>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
<script th:src="@{/js/script.js}"></script>
</body>
</html>
