<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Đổi mật khẩu</title>
    <link rel="stylesheet" th:href="@{/css/homeStyle.css}">
</head>
<body>
<div th:replace="~{client/layout/header :: header}"></div>
<div class="container-edit">
    <h2>Đổi mật khẩu</h2>
    <div th:if="${error != null}" class="error" th:text="${error}"></div>
    <form th:action="@{/profile/change-password}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" th:if="${_csrf != null}"/>
        <div class="form-group">
            <label class="lable" for="oldPassword">Mật khẩu cũ:</label>
            <input type="password" id="oldPassword" name="oldPassword" required>
        </div>
        <div class="form-group">
            <label class="lable" for="newPassword">Mật khẩu mới:</label>
            <input type="password" id="newPassword" name="newPassword" required>
        </div>
        <div class="form-group">
            <label class="lable" for="confirmPassword">Xác nhận mật khẩu mới:</label>
            <input type="password" id="confirmPassword" name="confirmPassword" required>
        </div>
        <button type="submit" class="btn">Đổi mật khẩu</button>
    </form>
</div>
</body>
</html>
