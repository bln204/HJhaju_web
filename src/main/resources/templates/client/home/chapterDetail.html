<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đọc Truyện</title>
    <link rel="stylesheet" th:href="@{/css/chapterDetailStyle.css}">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.6.1/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>

    <style>
        .comment-item { margin-bottom: 20px; padding: 10px; border-bottom: 1px solid #ddd; }
        .replies { margin-left: 20px; margin-top: 10px; }
        .reply-item { margin-bottom: 10px; padding: 8px; border-left: 2px solid #007bff; }
        .reply-btn { color: #007bff; cursor: pointer; margin-top: 5px; background: none; border: none; }
        .reply-form { margin-top: 10px; display: none; }
        .form-control { width: 100%; padding: 8px; margin-bottom: 10px; }
        .btn-primary { background-color: #007bff; color: white; padding: 8px 16px; border: none; cursor: pointer; }
    </style>

</head>
<body>

<!-- Navbar -->
<div class="navbar">
    <div class="navbar-container">
        <!-- Logo -->
        <a class="logo" href="/">
            <img th:src="@{/image/logo.png}" alt="Logo">
        </a>

        <!-- Menu -->
        <div class="menu">
            <a href="/">Trang Chủ</a>


            <div class="dropdown">
                <button class="dropdown-btn">Thể Loại</button>
                <div class="dropdown-content">
                    <div class="columns">
                        <div th:each="category : ${categories}">
                            <a th:href="@{/the-loai/{slug}(slug=${category.slug})}"
                               th:text="${category.name}"></a>
                        </div>
                    </div>
                </div>
            </div>


            <a href="#">Liên Hệ</a>
        </div>

        <!-- Search + Login -->
        <div style="display: flex; align-items: center;">
            <div class="search-container">
                <input type="text" id="searchBox" name="keyword" placeholder="Tìm kiếm truyện..." autocomplete="off">
                <button type="submit" class="search-btn">Tìm</button>
            </div>

            <button class="login-btn">Đăng Nhập</button>
            <button class="menu-btn" onclick="toggleSidebar()">📋 MENU</button>

        </div>
    </div>
</div>


<!-- Main Container -->
<div class="main-container">
    <!-- Content -->
    <main class="content" id="mainContent">
        <!-- Breadcrumb and Navigation Section -->
        <div class="breadcrumb-section">
            <div class="breadcrumb">
                <a href="/">Trang Chủ</a>
                <span class="separator">〉</span>
                <a th:href="@{/{slug}(slug=${comic.slug})}" th:text="${comic.name}"></a>
                <span class="separator">〉</span>
                <a th:text="'Chương ' + ${chapter.name}"></a>
            </div>

            <div class="chapter-navigation">
                <button class="nav-btn prev-btn" onclick="previousChapter()">
                    <span class="nav-icon">⟨</span>
                    <span class="nav-text">
                        <small>TRƯỚC</small>
                    </span>
                </button>

                <button class="nav-btn chapter-btn" onclick="showChapterList()">
                    <span class="nav-icon">☰</span>
                    <span class="nav-text">
                        <small>CHƯƠNG</small>
                    </span>
                </button>

                <button class="nav-btn next-btn" onclick="nextChapter()">
                    <span class="nav-icon">⟩</span>
                    <span class="nav-text">
                        <small>SAU</small>
                    </span>
                </button>
            </div>
        </div>

        <!-- Chapter Content -->
        <div class="chapter-container">
            <div class="chapter-content col col-8" th:each="images : ${images}">
                <img style="object-fit: cover; width:100%;height:auto;" th:src="${#strings.startsWith(images.image_file, 'http') ? images.image_file : '/file-upload/' + images.image_file }" alt="">
            </div>
        </div>


        <div class="breadcrumb-section">
            <div class="chapter-navigation">
                <button class="nav-btn prev-btn" onclick="previousChapter()">
                    <span class="nav-icon">⟨</span>
                    <span class="nav-text">
                        <small>TRƯỚC</small>
                    </span>
                </button>

                <button class="nav-btn chapter-btn" onclick="showChapterList()">
                    <span class="nav-icon">☰</span>
                    <span class="nav-text">
                        <small>CHƯƠNG</small>
                    </span>
                </button>

                <button class="nav-btn next-btn" onclick="nextChapter()">
                    <span class="nav-icon">⟩</span>
                    <span class="nav-text">
                        <small>SAU</small>
                    </span>
                </button>
            </div>
        </div>

    </main>

    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <span th:text="${comic.name}"></span>
        </div>

        <div class="sidebar-content">
            <!-- Chapter List -->
            <div class="sidebar-section">
                <h3>
                    <svg class="icon" viewBox="0 0 24 24">
                        <path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-5 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/>
                    </svg>
                    Chương
                </h3>
                <div class="sidebar-item active" onclick="showChapterSelector()">
                    <span th:text="'Chương ' + ${chapter.name}"></span>
                    <span class="page-number">Current ▶</span>
                </div>
            </div>

            <!-- Reading Options -->
            <div class="sidebar-section">
                <h3>
                    <svg class="icon" viewBox="0 0 24 24">
                        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/>
                    </svg>
                    Bình Luận
                </h3>
                <div class="sidebar-item">
                    <span>Viết bình luận</span>
                    <span>💬</span>
                </div>
            </div>

            <!-- Tools -->
            <div class="sidebar-section">
                <h3>
                    <svg class="icon" viewBox="0 0 24 24">
                        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/>
                    </svg>
                    Theo Dõi
                </h3>
                <div class="sidebar-item">
                    <span>Đánh dấu</span>
                    <span>🔖</span>
                </div>
            </div>

            <!-- Other Options -->
            <div class="sidebar-section">
                <h3>
                    <svg class="icon" viewBox="0 0 24 24">
                        <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>
                    </svg>
                    Báo Lỗi
                </h3>
                <div class="sidebar-item">
                    <span>Báo cáo lỗi</span>
                    <span>⚠️</span>
                </div>
            </div>

            <!-- Page to top -->
            <div class="sidebar-section">
                <h3>
                    <svg class="icon" viewBox="0 0 24 24">
                        <path d="M7.41 15.41L12 10.83l4.59 4.58L18 14l-6-6-6 6z"/>
                    </svg>
                    Lên đầu trang
                </h3>
                <div class="sidebar-item" onclick="scrollToTop()">
                    <span>Về đầu trang</span>
                    <span>⬆️</span>
                </div>
            </div>
        </div>
    </aside>

    <!-- Chapter Overlay -->
    <div class="chapter-overlay" id="chapterOverlay" onclick="toggleChapterSelector()"></div>

    <!-- Chapter Selector -->
    <div class="chapter-selector" id="chapterSelector">
        <div class="chapter-selector-header">
            <div class="chapter-selector-title">
                📚 Danh Sách Chương
            </div>
            <button class="close-chapter-selector" onclick="toggleChapterSelector()">✕</button>
        </div>

        <div class="chapter-search-container">
            <input type="text" class="chapter-search-box" placeholder="🔍 Nhập số chương cần tìm..."
                   oninput="searchChapters(this.value)" id="chapterSearchInput">
        </div>

        <div class="chapter-list" id="chapterList">
            <div th:each="chapter : ${comic.chapter}" class="chapter-list-item current" >
                <a  th:href="@{/{slug}/chuong-{name}(slug=${comic.slug}, name=${chapter.name})}" style="text-decoration: none">
                    <div class="chapter-name" th:text="'Chương ' +  ${chapter.name}"></div>
                    <div class="chapter-date">Hôm nay</div>

                </a>
            </div>
        </div>
    </div>



    <!-- Overlay -->
    <div class="overlay" id="overlay" onclick="toggleSidebar()"></div>
</div>

<div class="comments-section">
    <h2>Bình luận</h2>
    <div class="comment-form" th:if="${#authentication.authenticated}">
        <textarea id="commentInput" placeholder="Viết bình luận..." class="form-control"></textarea>
        <button id="submitComment" class="btn btn-primary mt-2">Gửi</button>
        <div id="commentError" style="color: red; display: none; margin-top: 10px;"></div>
    </div>
    <div class="comment-form" th:unless="${#authentication.authenticated}">
        <p>Vui lòng <a th:href="@{/login}">đăng nhập</a> để bình luận.</p>
    </div>
    <div class="comments-box" id="commentsBox">
        <div th:each="comment : ${comments}" class="comment-item" th:data-comment-id="${comment.id}">
            <div class="comment-user" th:text="${comment.user.fullName} ?: 'Người dùng'"></div>
            <div class="comment-content" th:text="${comment.content}"></div>
            <div class="comment-time" th:text="${#temporals.format(comment.createdAt, 'dd/MM/yyyy HH:mm')}"></div>
            <div class="replies">
                <div th:each="reply : ${comment.replies}" class="reply-item">
                    <div class="reply-user" th:text="${reply.user.fullName} ?: 'Người dùng'"></div>
                    <div class="reply-content" th:text="${reply.content}"></div>
                    <div class="reply-time" th:text="${#temporals.format(reply.createdAt, 'dd/MM/yyyy HH:mm')}"></div>
                </div>
            </div>
            <button class="reply-btn" th:data-comment-id="${comment.id}">Trả lời</button>
            <div class="reply-form" th:id="'replyForm' + ${comment.id}" style="display: none;">
                <textarea th:id="'replyInput' + ${comment.id}" placeholder="Viết trả lời..." class="form-control"></textarea>
                <button class="btn btn-primary mt-2" th:onclick="'submitReply(' + ${comment.id} + ')'">Gửi trả lời</button>
            </div>
        </div>
        <div th:unless="${comments != null and not #lists.isEmpty(comments)}" class="no-comments">Chưa có bình luận nào.</div>
    </div>
</div>

<script>
    // Show Chapter Selector function
    function showChapterSelector() {
        toggleChapterSelector();
    }

    // Toggle Chapter Selector
    function toggleChapterSelector() {
        const chapterSelector = document.getElementById('chapterSelector');
        const chapterOverlay = document.getElementById('chapterOverlay');

        chapterSelector.classList.toggle('active');
        chapterOverlay.classList.toggle('active');

        // Focus vào search box khi mở
        if (chapterSelector.classList.contains('active')) {
            setTimeout(() => {
                document.getElementById('chapterSearchInput').focus();
            }, 400);
        }
    }

    // Search Chapters function
    function searchChapters(searchTerm) {
        const chapterList = document.getElementById('chapterList');
        const items = chapterList.querySelectorAll('.chapter-list-item');

        items.forEach(item => {
            const chapterName = item.querySelector('.chapter-name').textContent.toLowerCase();
            if (chapterName.includes(searchTerm.toLowerCase()) || searchTerm === '') {
                item.style.display = 'flex';
            } else {
                item.style.display = 'none';
            }
        });
    }

    // Select Chapter function
    function selectChapter(chapterNumber) {
        // Update current chapter in sidebar
        const currentChapterSpan = document.querySelector('.sidebar-item.active span');
        if (currentChapterSpan) {
            currentChapterSpan.textContent = `Chương ${chapterNumber}`;
        }

        // Update breadcrumb
        const breadcrumbSpan = document.querySelector('.breadcrumb span:last-child');
        if (breadcrumbSpan) {
            breadcrumbSpan.textContent = `Chương ${chapterNumber}`;
        }

        // Close chapter selector
        toggleChapterSelector();
    }

    // Toggle Sidebar
    function toggleSidebar() {
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('overlay');
        const content = document.getElementById('mainContent');

        sidebar.classList.toggle('active');
        overlay.classList.toggle('active');

        if (window.innerWidth > 768) {
            content.classList.toggle('with-sidebar');
        }
    }

    // Navigation functions
    function previousChapter() {
        console.log('Chuyển sang Chapter trước');
        alert('Chuyển sang Chapter trước');
    }

    function nextChapter() {
        console.log('Chuyển sang Chapter sau');
        alert('Chuyển sang Chapter sau');
    }

    function showChapterList() {
        console.log('Hiển thị danh sách chương');
        toggleSidebar();
    }

    function scrollToTop() {
        window.scrollTo({
            top: 0,
            behavior: 'smooth'
        });
    }

    // Close sidebar when clicking on sidebar items
    document.addEventListener('DOMContentLoaded', function() {
        const sidebarItems = document.querySelectorAll('.sidebar-item');
        sidebarItems.forEach(item => {
            item.addEventListener('click', function(e) {
                if (this.onclick !== scrollToTop) {
                    console.log('Clicked:', this.textContent.trim());
                }
            });
        });
    });

    // Handle responsive behavior
    window.addEventListener('resize', function() {
        const sidebar = document.getElementById('sidebar');
        const content = document.getElementById('mainContent');

        if (window.innerWidth <= 768) {
            content.classList.remove('with-sidebar');
        } else if (sidebar.classList.contains('active')) {
            content.classList.add('with-sidebar');
        }
    });

    // Close sidebar with Escape key
    document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') {
            const sidebar = document.getElementById('sidebar');
            const chapterSelector = document.getElementById('chapterSelector');

            if (chapterSelector.classList.contains('active')) {
                toggleChapterSelector();
            } else if (sidebar.classList.contains('active')) {
                toggleSidebar();
            }
        }
    });

    // Clear search when chapter selector closes
    document.addEventListener('click', function(e) {
        const chapterSelector = document.getElementById('chapterSelector');
        if (!chapterSelector.classList.contains('active')) {
            document.getElementById('chapterSearchInput').value = '';
            searchChapters(''); // Reset search
        }
    });
</script>
<script th:inline="javascript">
    console.log('Script loaded');
    var comicId = [[${comic.id}]] ? [[${comic.id}]] : null;
    console.log('comic.id:', comicId);
    console.log('authenticated:', [[${#authentication.authenticated}]]);
    var stompClient = null;
    var isConnecting = false;
    var maxRetries = 5;
    var retryCount = 0;

    function connectWebSocket(callback) {
        if (stompClient && stompClient.connected) {
            console.log('WebSocket already connected');
            callback();
            return;
        }
        if (isConnecting) {
            console.log('WebSocket connection in progress');
            if (retryCount < maxRetries) {
                retryCount++;
                setTimeout(() => connectWebSocket(callback), 500);
            } else {
                console.error('Max WebSocket connection retries reached');
                var errorDiv = document.getElementById('commentError');
                if (errorDiv) {
                    errorDiv.innerText = 'Không thể kết nối với server sau nhiều lần thử. Vui lòng thử lại sau.';
                    errorDiv.style.display = 'block';
                }
                isConnecting = false;
                retryCount = 0;
            }
            return;
        }
        console.log('Attempting to connect WebSocket, comic.id: ' + comicId);
        if (!comicId) {
            console.error('Error: comic.id is undefined or null');
            var errorDiv = document.getElementById('commentError');
            if (errorDiv) {
                errorDiv.innerText = 'Không thể kết nối do lỗi dữ liệu truyện.';
                errorDiv.style.display = 'block';
            }
            isConnecting = false;
            return;
        }
        isConnecting = true;
        retryCount++;
        var socket;
        try {
            socket = new SockJS('http://localhost:8080/ws');
        } catch (e) {
            console.error('Error creating SockJS: ' + e);
            isConnecting = false;
            retryCount = 0;
            var errorDiv = document.getElementById('commentError');
            if (errorDiv) {
                errorDiv.innerText = 'Lỗi khi khởi tạo kết nối WebSocket. Vui lòng thử lại.';
                errorDiv.style.display = 'block';
            }
            return;
        }
        stompClient = Stomp.over(socket);
        stompClient.connect({}, function(frame) {
            isConnecting = false;
            retryCount = 0;
            console.log('WebSocket Connected: ' + frame);
            stompClient.subscribe('/topic/comic/' + comicId + '/comments', function(comment) {
                console.log('Received comment: ', JSON.parse(comment.body));
                var commentData = JSON.parse(comment.body);
                console.log('Comment parentId: ', commentData.parentId);
                var commentsBox = document.getElementById('commentsBox');
                var noComments = commentsBox.querySelector('.no-comments');
                if (noComments) {
                    noComments.remove();
                }

                if (commentData.parentId) {
                    console.log('Processing reply for parentId: ', commentData.parentId);
                    var parentComment = document.querySelector(`.comment-item[data-comment-id="${commentData.parentId}"]`);
                    if (parentComment) {
                        console.log('Parent comment found, appending reply');
                        var repliesContainer = parentComment.querySelector('.replies');
                        var replyItem = document.createElement('div');
                        replyItem.className = 'reply-item';
                        replyItem.innerHTML = `
                            <div class="reply-user">${commentData.user.fullName || 'Người dùng'}</div>
                            <div class="reply-content">${commentData.content}</div>
                            <div class="reply-time">${new Date(commentData.createdAt).toLocaleString('vi-VN')}</div>
                        `;
                        repliesContainer.appendChild(replyItem);
                    } else {
                        console.warn(`Parent comment with id ${commentData.parentId} not found in DOM`);
                    }
                } else {
                    console.log('Processing new comment');
                    var commentItem = document.createElement('div');
                    commentItem.className = 'comment-item';
                    commentItem.setAttribute('data-comment-id', commentData.id);
                    commentItem.innerHTML = `
                        <div class="comment-user">${commentData.user.fullName || 'Người dùng'}</div>
                        <div class="comment-content">${commentData.content}</div>
                        <div class="comment-time">${new Date(commentData.createdAt).toLocaleString('vi-VN')}</div>
                        <div class="replies"></div>
                        <button class="reply-btn" data-comment-id="${commentData.id}">Trả lời</button>
                        <div class="reply-form" id="replyForm${commentData.id}" style="display: none;">
                            <textarea id="replyInput${commentData.id}" placeholder="Viết trả lời..." class="form-control"></textarea>
                            <button class="btn btn-primary mt-2" onclick="submitReply(${commentData.id})">Gửi trả lời</button>
                        </div>
                    `;
                    commentsBox.insertBefore(commentItem, commentsBox.firstChild);
                }
            });
            callback();
        }, function(error) {
            isConnecting = false;
            console.error('WebSocket Error: ' + error);
            var errorDiv = document.getElementById('commentError');
            if (errorDiv) {
                errorDiv.innerText = 'Không thể kết nối với server. Vui lòng thử lại.';
                errorDiv.style.display = 'block';
            }
            if (retryCount < maxRetries) {
                console.log('Retrying WebSocket connection, attempt: ' + retryCount);
                setTimeout(() => connectWebSocket(callback), 500);
            } else {
                console.error('Max WebSocket connection retries reached');
                errorDiv.innerText = 'Không thể kết nối với server sau nhiều lần thử. Vui lòng thử lại sau.';
                errorDiv.style.display = 'block';
                retryCount = 0;
            }
        });
    }

    document.addEventListener('DOMContentLoaded', function() {
        console.log('DOMContentLoaded event triggered');
        var submitCommentBtn = document.getElementById('submitComment');
        console.log('submitCommentBtn:', submitCommentBtn);
        if (submitCommentBtn) {
            submitCommentBtn.addEventListener('click', function() {
                console.log('Submit comment button clicked');
                var content = document.getElementById('commentInput').value.trim();
                var errorDiv = document.getElementById('commentError');
                if (!content) {
                    if (errorDiv) {
                        errorDiv.innerText = 'Vui lòng nhập nội dung bình luận.';
                        errorDiv.style.display = 'block';
                    }
                    console.log('Empty comment content');
                    return;
                }
                if (errorDiv) errorDiv.style.display = 'none';
                connectWebSocket(function() {
                    if (!stompClient || !stompClient.connected) {
                        if (errorDiv) {
                            errorDiv.innerText = 'Không thể kết nối với server. Vui lòng thử lại.';
                            errorDiv.style.display = 'block';
                        }
                        console.log('WebSocket not connected');
                        return;
                    }
                    console.log('Sending comment: ' + content);
                    this.innerHTML = '<span class="spinner-border spinner-border-sm"></span> Đang gửi...';
                    this.disabled = true;
                    stompClient.send("/app/comic/" + comicId + "/comment", {}, JSON.stringify({ content: content }));
                    document.getElementById('commentInput').value = '';
                    setTimeout(() => {
                        this.innerHTML = 'Gửi';
                        this.disabled = false;
                    }, 1000);
                }.bind(this));
            });
        } else {
            console.error('submitCommentBtn not found');
        }

        var commentInput = document.getElementById('commentInput');
        console.log('commentInput:', commentInput);
        if (commentInput) {
            commentInput.addEventListener('keypress', function(e) {
                if (e.key === 'Enter' && !e.shiftKey) {
                    console.log('Enter key pressed in commentInput');
                    e.preventDefault();
                    submitCommentBtn.click();
                }
            });
        } else {
            console.error('commentInput not found');
        }

        document.addEventListener('click', function(e) {
            if (e.target.classList.contains('reply-btn')) {
                var commentId = e.target.getAttribute('data-comment-id');
                console.log('Reply button clicked for commentId: ' + commentId);
                var replyForm = document.getElementById('replyForm' + commentId);
                if (replyForm) {
                    replyForm.style.display = replyForm.style.display === 'none' ? 'block' : 'none';
                    if (replyForm.style.display === 'block') {
                        document.getElementById('replyInput' + commentId).focus();
                    }
                }
            }
        });

        window.submitReply = function(commentId) {
            var replyInput = document.getElementById('replyInput' + commentId);
            var content = replyInput.value.trim();
            var errorDiv = document.getElementById('commentError');
            if (!content) {
                if (errorDiv) {
                    errorDiv.innerText = 'Vui lòng nhập nội dung trả lời.';
                    errorDiv.style.display = 'block';
                }
                console.log('Empty reply content');
                return;
            }
            if (errorDiv) errorDiv.style.display = 'none';
            connectWebSocket(function() {
                if (!stompClient || !stompClient.connected) {
                    if (errorDiv) {
                        errorDiv.innerText = 'Không thể kết nối với server. Vui lòng thử lại.';
                        errorDiv.style.display = 'block';
                    }
                    console.log('WebSocket not connected');
                    return;
                }
                console.log('Sending reply for commentId: ' + commentId + ', content: ' + content);
                var replyBtn = document.querySelector(`#replyForm${commentId} .btn-primary`);
                replyBtn.innerHTML = '<span class="spinner-border spinner-border-sm"></span> Đang gửi...';
                replyBtn.disabled = true;
                stompClient.send("/app/comic/" + comicId + "/comment", {}, JSON.stringify({ content: content, parentId: commentId }));
                replyInput.value = '';
                replyBtn.innerHTML = 'Gửi trả lời';
                replyBtn.disabled = false;
                document.getElementById('replyForm' + commentId).style.display = 'none';
            });
        };
    });
</script>
</body>
</html>
