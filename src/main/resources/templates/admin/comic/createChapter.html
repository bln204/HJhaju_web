<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta http-equiv="X-UA-Compatible" content="IE=edge"/>
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no"/>
    <meta name="description" content=""/>
    <meta name="author" content=""/>
    <title>Dashboard - Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/simple-datatables@7.1.2/dist/style.min.css" rel="stylesheet"/>
    <script src="https://use.fontawesome.com/releases/v6.3.0/js/all.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <script>

        function handleAddData() {
            const file = document.getElementById("file").files[0];
            const fileInput = document.getElementById("file");
            let formData = new FormData();
            if (file != null) {
                formData.append("file", file);
                fetch("/api/files/upload", {
                    method: "POST",
                    body: formData
                })
                    .then(res => res.text()) // server trả về URL
                    .then(url => {
                        console.log("File uploaded, URL:", url);

                        const image = `
<div class="d-flex justify-content-center chapter-item">
    <input type="hidden" name="imageFile" value="${url}">
    <img class="col col-8" src="/file-upload/${url}" alt="">
</div>`;


                        const content = document.getElementById("content");
                        const wrapper = document.createElement('div');
                        wrapper.innerHTML = image;
                        content.appendChild(wrapper);
                    })
                    .catch(err => {
                        console.error("Upload error:", err);
                        fileInput.value = "";
                    });
            }
        }

    </script>
</head>
<body class="sb-nav-fixed">
<div th:replace="admin/layout/header :: header"></div>
<div id="layoutSidenav">
    <div th:replace="admin/layout/sidebar :: sidebar"></div>
    <div id="layoutSidenav_content">
        <main>
            <div class="container-fluid px-4">
                <h1 class="mt-4">Name comic: <span class="text-danger"></span></h1>
                <ol class="breadcrumb mb-4">
                    <li class="breadcrumb-item active">Comic details</li>
                </ol>

                <form th:action="@{'/admin/' + ${comic.slug} + '/add-chapter'}" th:object="${chapter}" method="post">
                    <div class="form-outline d-flex col-4 mb-4">
                        <input name="name" type="text" id="form16" class="form-control" data-mdb-showcounter="true"
                               maxlength="20" th:value="${newChap}" readonly/>
                        <button type="submit" class="btn btn-dark ms-4">save</button>
                    </div>

                    <div class="card mb-4">
                        <div class="card-header d-flex justify-content-between align-items-center">
                            <div class="col-3 d-flex">
                                <input class="form-control" type="file" id="file">
                                <button onclick="handleAddData()" type="button" class="btn btn-dark ms-4">Add</button>
                            </div>
                        </div>
                        <div id="content"></div>
                    </div>
                </form>
            </div>
        </main>
        <div th:replace="admin/layout/footer :: footer"></div>
    </div>
</div>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"
        crossorigin="anonymous"></script>
<script th:src="@{/js/script.js}"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/2.8.0/Chart.min.js" crossorigin="anonymous"></script>
<script th:src="@{/js/chart-area-demo.js}"></script>
<script th:src="@{/js/chart-bar-demo.js}"></script>
<script src="https://cdn.jsdelivr.net/npm/simple-datatables@7.1.2/dist/umd/simple-datatables.min.js"
        crossorigin="anonymous"></script>
<script th:src="@{/js/datatables-simple-demo.js}"></script>
</body>
</html>
